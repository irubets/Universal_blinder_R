<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1010" width="900" height="1010" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <title>Universal Blinder workflow</title>
  <desc>Study tab, then (Workflows 2 and 3) Prepare PC: put the results into PC, or release the lab file blinded, then Blind and QC: 1. Pre-flight until nothing is left to decide, 2. Run blinding with the codebook review loop and the fix loop when nothing is released, 3. QC result, share output, Retrieve.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <style>
      .tab  { fill: #e7f1ff; stroke: #0d6efd; stroke-width: 1.5; }
      .dec  { fill: #fff8e1; stroke: #b58900; stroke-width: 1.5; }
      .loop { fill: #fff3cd; stroke: #d39e00; stroke-width: 1.5; }
      .fail { fill: #f8d7da; stroke: #b02a37; stroke-width: 1.5; }
      .ok   { fill: #d1e7dd; stroke: #198754; stroke-width: 1.5; }
      .line { stroke: #444; stroke-width: 1.5; fill: none; marker-end: url(#arr); }
      .t    { fill: #212529; text-anchor: middle; }
      .b    { font-weight: 700; }
      .lab  { fill: #495057; font-size: 12px; font-style: italic; }
    </style>
  </defs>
  <rect x="0" y="0" width="900" height="1010" fill="#ffffff"/>

  <!-- 1 Study -->
  <rect class="tab" x="300" y="20" width="320" height="64" rx="8"/>
  <text class="t" x="460" y="44"><tspan class="b">Study tab</tspan></text>
  <text class="t" x="460" y="62">choose the study folder, create UB_&lt;Study&gt;,</text>
  <text class="t" x="460" y="78">copy the datasets into input</text>
  <path class="line" d="M460,84 L460,112"/>

  <!-- D1 PC has results? -->
  <polygon class="dec" points="460,114 600,154 460,194 320,154"/>
  <text class="t" x="460" y="150">Does PC have its</text>
  <text class="t" x="460" y="166">concentrations?</text>
  <path class="line" d="M600,154 L658,154"/>
  <text class="lab" x="606" y="146">no</text>
  <rect class="tab" x="660" y="108" width="230" height="110" rx="8"/>
  <text class="t" x="775" y="132"><tspan class="b">Prepare PC</tspan> (Workflow 2)</text>
  <text class="t" x="775" y="150">put the lab's results into PC;</text>
  <text class="t" x="775" y="174">if they can't be matched:</text>
  <text class="t" x="775" y="192"><tspan class="b">Workflow 3</tspan>: release the</text>
  <text class="t" x="775" y="208" font-size="12">lab file blinded next to PC</text>
  <path class="line" d="M770,218 L770,262 L622,262"/>
  <path class="line" d="M460,194 L460,232"/>
  <text class="lab" x="468" y="218">yes: Workflow 1</text>

  <!-- 2 Pre-flight -->
  <rect class="tab" x="300" y="234" width="320" height="56" rx="8"/>
  <text class="t" x="460" y="257"><tspan class="b">Blind &amp; QC → 1. Pre-flight</tspan></text>
  <text class="t" x="460" y="275">click Run pre-flight</text>
  <path class="line" d="M460,290 L460,322"/>

  <!-- D2 rows left? -->
  <polygon class="dec" points="460,324 600,368 460,412 320,368"/>
  <text class="t" x="460" y="364">Rows you still</text>
  <text class="t" x="460" y="380">want to change?</text>
  <path class="line" d="M600,368 L658,368"/>
  <text class="lab" x="606" y="360">yes</text>
  <rect class="loop" x="660" y="330" width="220" height="76" rx="8"/>
  <text class="t" x="770" y="352">highlight the rows you accept,</text>
  <text class="t" x="770" y="370">click <tspan class="b">Apply suggestions</tspan></text>
  <text class="t" x="770" y="388">(or decide in Study settings)</text>
  <path class="line" d="M850,330 L850,282 L622,282"/>
  <text class="lab" x="700" y="300">run the pre-flight again</text>
  <path class="line" d="M460,412 L460,470"/>
  <text class="lab" x="452" y="432" text-anchor="end">no: the table is empty,</text>
  <text class="lab" x="452" y="448" text-anchor="end">or what is left stays by your choice</text>

  <!-- 3 Run blinding -->
  <rect class="tab" x="300" y="472" width="320" height="56" rx="8"/>
  <text class="t" x="460" y="495"><tspan class="b">2. Run blinding</tspan></text>
  <text class="t" x="460" y="513">click Run blinding</text>
  <path class="line" d="M460,528 L460,560"/>

  <!-- D3 result -->
  <polygon class="dec" points="460,562 570,612 460,662 350,612"/>
  <text class="t" x="460" y="608">What does</text>
  <text class="t" x="460" y="624">the run say?</text>

  <!-- left: codebook loop -->
  <path class="line" d="M350,612 L232,612"/>
  <text class="lab" x="291" y="604" text-anchor="middle">stops: new</text>
  <text class="lab" x="291" y="630" text-anchor="middle">codebook rows</text>
  <rect class="loop" x="10" y="562" width="220" height="112" rx="8"/>
  <text class="t" x="120" y="584"><tspan class="b">Codebook review</tspan></text>
  <text class="t" x="120" y="602">(always after the first run)</text>
  <text class="t" x="120" y="620">answer red and amber rows,</text>
  <text class="t" x="120" y="638">Mark as decided / Save codebook,</text>
  <text class="t" x="120" y="656"><tspan class="b">I have reviewed the codebook</tspan></text>
  <path class="line" d="M120,562 L120,500 L298,500"/>
  <text class="lab" x="130" y="490">Run blinding again</text>

  <!-- right: nothing released -->
  <path class="line" d="M570,612 L678,612"/>
  <text class="lab" x="624" y="604" text-anchor="middle">NOTHING WAS</text>
  <text class="lab" x="624" y="630" text-anchor="middle">RELEASED</text>
  <rect class="fail" x="680" y="556" width="210" height="124" rx="8"/>
  <text class="t" x="785" y="578"><tspan class="b">Read why</tspan> (red box: the</text>
  <text class="t" x="785" y="596">failed QC checks, or the error)</text>
  <text class="t" x="785" y="616">fix with Pre-flight Apply,</text>
  <text class="t" x="785" y="634">Study settings, the codebook,</text>
  <text class="t" x="785" y="652">or a reviewed QC waiver;</text>
  <text class="t" x="785" y="670">Ask the AI why, if unclear</text>
  <path class="line" d="M785,556 L785,500 L622,500"/>
  <text class="lab" x="640" y="490">Run blinding again</text>

  <path class="line" d="M460,662 L460,720"/>
  <text class="lab" x="468" y="696">FINISHED: QC PASS or WARN</text>

  <!-- 4 QC result -->
  <rect class="tab" x="300" y="722" width="320" height="56" rx="8"/>
  <text class="t" x="460" y="745"><tspan class="b">3. QC result</tspan></text>
  <text class="t" x="460" y="763">read qc_summary.md; judge every WARN</text>
  <path class="line" d="M460,778 L460,808"/>

  <!-- 5 share -->
  <rect class="ok" x="300" y="810" width="320" height="56" rx="8"/>
  <text class="t" x="460" y="833"><tspan class="b">Share only output</tspan></text>
  <text class="t" x="460" y="851">never input or private</text>
  <path class="line" d="M460,866 L460,896"/>

  <!-- 6 retrieve -->
  <rect class="tab" x="300" y="898" width="320" height="64" rx="8"/>
  <text class="t" x="460" y="922"><tspan class="b">Retrieve</tspan> (after the review)</text>
  <text class="t" x="460" y="940">map the reviewer's findings back</text>
  <text class="t" x="460" y="956">to the original records</text>

  <!-- legend -->
  <rect class="tab" x="20" y="975" width="14" height="14" rx="3"/><text x="40" y="987" fill="#212529">app tab</text>
  <rect class="dec" x="110" y="975" width="14" height="14"/><text x="130" y="987" fill="#212529">question</text>
  <rect class="loop" x="205" y="975" width="14" height="14" rx="3"/><text x="225" y="987" fill="#212529">your decision, then back</text>
  <rect class="fail" x="390" y="975" width="14" height="14" rx="3"/><text x="410" y="987" fill="#212529">nothing released: fix, then run again</text>
</svg>
